name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6"
      - run: ruff check --output-format=github .

  test:
    name: Tests (Python 3.11, Spark 3.5 + Delta 3.2)
    runs-on: ubuntu-latest
    env:
      REQUIRE_SPARK: "1"     # fail instead of skipping the notebook Spark tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # Fabric Runtime 1.3 runs Python 3.11
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Delta Lake jars
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-delta-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=95 --junitxml=test-results.xml
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test-results.xml
            coverage.xml

  coverage-badge:
    name: Publish coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # pushes the badge to the 'badges' branch
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-reports
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render badge from coverage.xml
        run: |
          pip install "genbadge[coverage]>=1.1"
          mkdir badge
          genbadge coverage -i coverage.xml -o badge/coverage.svg
      - name: Push badge to the badges branch
        # Adds a normal commit on top of 'badges' (no force push), so it works with branch protection rules.
        run: |
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch badges "$REPO" publish || git init -q -b badges publish
          cp badge/coverage.svg publish/coverage.svg
          cd publish
          git add coverage.svg
          if git diff --cached --quiet; then echo "Coverage unchanged; nothing to publish"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Update coverage badge for ${GITHUB_SHA::7}"
          git push -q "$REPO" HEAD:badges
